name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  frontend-check:
    name: Frontend Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/react-dashboard/package-lock.json

      - name: Install dependencies
        working-directory: frontend/react-dashboard
        run: npm ci

      - name: Lint
        working-directory: frontend/react-dashboard
        run: npm run lint

      - name: Build
        working-directory: frontend/react-dashboard
        run: npm run build

  container-images:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: .
            file: services/backend/container/Containerfile
            image: azure-aks-iot-platform-backend

          - name: ros2-simulator
            context: .
            file: edge/ros2-simulator/container/Containerfile
            image: azure-aks-iot-platform-ros2-simulator

          - name: frontend
            context: frontend/react-dashboard
            file: frontend/react-dashboard/Containerfile
            image: azure-aks-iot-platform-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and optionally push image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

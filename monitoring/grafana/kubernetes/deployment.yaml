apiVersion: v1
kind: ConfigMap
metadata:
  name: azure-aks-iot-platform-grafana-provisioning
  namespace: azure-aks-iot
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: azure-aks-iot-platform
data:
  prometheus.yml: |
    apiVersion: 1
    
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://azure-aks-iot-platform-prometheus.azure-aks-iot.svc.cluster.local:9090
        isDefault: true
        editable: false
  dashboards.yml: |
    apiVersion: 1
    
    providers:
      - name: Azure AKS IoT Platform
        orgId: 1
        folder: Azure AKS IoT Platform
        type: file
        disableDeletion: false
        editable: true
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
  iot-platform-overview.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "graphTooltip": 0,
      "panels": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "wideLayout": true
          },
          "targets": [
            {
              "expr": "broker_clients_connected",
              "refId": "A"
            }
          ],
          "title": "MQTT Clients Connected",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "id": 2,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "wideLayout": true
          },
          "targets": [
            {
              "expr": "up{job=\"mosquitto\"}",
              "refId": "A"
            }
          ],
          "title": "Mosquitto Exporter UP",
          "type": "stat"
        }
      ],
      "refresh": "10s",
      "schemaVersion": 41,
      "tags": [
        "iot",
        "mosquitto",
        "prometheus"
      ],
      "templating": {
        "list": []
      },
      "time": {
        "from": "now-15m",
        "to": "now"
      },
      "timezone": "browser",
      "title": "Azure AKS IoT Platform Overview",
      "uid": "azure-aks-iot-platform-overview",
      "version": 1
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: azure-aks-iot-platform-grafana-data
  namespace: azure-aks-iot
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: azure-aks-iot-platform
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: azure-aks-iot-platform-grafana
  namespace: azure-aks-iot
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: azure-aks-iot-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
      app.kubernetes.io/part-of: azure-aks-iot-platform
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: azure-aks-iot-platform
    spec:
      securityContext:
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana-oss:13.0.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin"
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources/prometheus.yml
              subPath: prometheus.yml
              readOnly: true
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml
              subPath: dashboards.yml
              readOnly: true
            - name: provisioning
              mountPath: /var/lib/grafana/dashboards/iot-platform-overview.json
              subPath: iot-platform-overview.json
              readOnly: true
            - name: data
              mountPath: /var/lib/grafana
      volumes:
        - name: provisioning
          configMap:
            name: azure-aks-iot-platform-grafana-provisioning
        - name: data
          persistentVolumeClaim:
            claimName: azure-aks-iot-platform-grafana-data
---
apiVersion: v1
kind: Service
metadata:
  name: azure-aks-iot-platform-grafana
  namespace: azure-aks-iot
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: azure-aks-iot-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: azure-aks-iot-platform
  ports:
    - name: http
      port: 3000
      targetPort: http

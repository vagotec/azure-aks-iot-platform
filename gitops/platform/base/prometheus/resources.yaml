apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: azure-aks-iot-platform-prometheus-data
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: azure-aks-iot-platform
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: azure-aks-iot-platform-prometheus
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: azure-aks-iot-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
      app.kubernetes.io/part-of: azure-aks-iot-platform
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/part-of: azure-aks-iot-platform
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.14.0
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
          ports:
            - name: http
              containerPort: 9090
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: azure-aks-iot-platform-prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: azure-aks-iot-platform-prometheus-data
---
apiVersion: v1
kind: Service
metadata:
  name: azure-aks-iot-platform-prometheus
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: azure-aks-iot-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: azure-aks-iot-platform
  ports:
    - name: http
      port: 9090
      targetPort: http
      protocol: TCP

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  - job_name: prometheus
    static_configs:
      - targets:
          - 127.0.0.1:9090

  - job_name: mosquitto
    metrics_path: /metrics
    static_configs:
      - targets:
          - azure-aks-iot-platform-mosquitto-exporter.azure-aks-iot.svc.cluster.local:9234

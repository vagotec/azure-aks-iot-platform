apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: azure-aks-iot-platform-grafana-data
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: azure-aks-iot-platform
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: azure-aks-iot-platform-grafana
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: azure-aks-iot-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
      app.kubernetes.io/part-of: azure-aks-iot-platform
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: azure-aks-iot-platform
    spec:
      securityContext:
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:13.0.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: azure-aks-iot-platform-grafana-admin
                  key: admin-password
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources/prometheus.yml
              subPath: prometheus.yml
              readOnly: true
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml
              subPath: dashboards.yml
              readOnly: true
            - name: provisioning
              mountPath: /var/lib/grafana/dashboards/iot-platform-overview.json
              subPath: iot-platform-overview.json
              readOnly: true
            - name: data
              mountPath: /var/lib/grafana
      volumes:
        - name: provisioning
          configMap:
            name: azure-aks-iot-platform-grafana-provisioning
        - name: data
          persistentVolumeClaim:
            claimName: azure-aks-iot-platform-grafana-data
---
apiVersion: v1
kind: Service
metadata:
  name: azure-aks-iot-platform-grafana
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: azure-aks-iot-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: azure-aks-iot-platform
  ports:
    - name: http
      port: 3000
      targetPort: http

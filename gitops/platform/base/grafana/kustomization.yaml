apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: azure-aks-iot-platform-grafana-provisioning
    files:
      - prometheus.yml
      - dashboards.yml
      - iot-platform-overview.json

resources:
  - resources.yaml

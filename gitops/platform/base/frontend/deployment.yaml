apiVersion: apps/v1
kind: Deployment
metadata:
  name: azure-aks-iot-platform-frontend
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: azure-aks-iot-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
      app.kubernetes.io/part-of: azure-aks-iot-platform
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: azure-aks-iot-platform
    spec:
      containers:
        - name: frontend
          image: azure-aks-iot-platform-frontend:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: azure-aks-iot-platform
  labels:
    app.kubernetes.io/part-of: azure-aks-iot-platform
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: azure-aks-iot-platform
      sectionName: http

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - group: ""
          kind: Service
          name: azure-aks-iot-platform-backend
          port: 8080
          weight: 1

    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: azure-aks-iot-platform-frontend
          port: 8080
          weight: 1

apiVersion: apps/v1
kind: Deployment
metadata:
  name: azure-aks-iot-platform-backend
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: azure-aks-iot-platform
spec:
  replicas: 1

  # The Backend uses one fixed MQTT client ID.
  # Recreate prevents old and new Pods from connecting to Mosquitto
  # simultaneously during an update.
  strategy:
    type: Recreate

  selector:
    matchLabels:
      app.kubernetes.io/name: backend
      app.kubernetes.io/part-of: azure-aks-iot-platform

  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: azure-aks-iot-platform

    spec:
      containers:
        - name: backend
          image: azure-aks-iot-platform-backend:local
          imagePullPolicy: Never

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          env:
            - name: ROS_DOMAIN_ID
              value: "42"

            - name: ROS2_TOPIC
              value: "/iot/telemetry"

            - name: ROS2_COMMAND_SERVICE
              value: "/iot/command"

            - name: MQTT_HOST
              value: "azure-aks-iot-platform-mosquitto"

            - name: MQTT_PORT
              value: "1883"

            - name: MQTT_TOPIC
              value: "azure-aks-iot-platform/telemetry"

            - name: MQTT_COMMAND_TOPIC
              value: "azure-aks-iot-platform/command"

            - name: MQTT_CLIENT_ID
              value: "azure-aks-iot-platform-backend"

            - name: MQTT_QOS
              value: "1"

            - name: REST_HOST
              value: "0.0.0.0"

            - name: REST_PORT
              value: "8080"

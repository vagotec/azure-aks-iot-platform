apiVersion: apps/v1
kind: Deployment
metadata:
  name: azure-aks-iot-platform-mosquitto-exporter
  labels:
    app.kubernetes.io/name: mosquitto-exporter
    app.kubernetes.io/part-of: azure-aks-iot-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mosquitto-exporter
      app.kubernetes.io/part-of: azure-aks-iot-platform
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mosquitto-exporter
        app.kubernetes.io/part-of: azure-aks-iot-platform
    spec:
      containers:
        - name: mosquitto-exporter
          image: ghcr.io/d0ugal/mosquitto-exporter:v0.2.51
          imagePullPolicy: IfNotPresent
          env:
            - name: MOSQUITTO_BROKER_ENDPOINT
              value: "tcp://azure-aks-iot-platform-mosquitto.azure-aks-iot.svc.cluster.local:1883"
            - name: LOG_LEVEL
              value: "info"
            - name: LOG_FORMAT
              value: "json"
          ports:
            - name: metrics
              containerPort: 9234
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: azure-aks-iot-platform-mosquitto-exporter
  labels:
    app.kubernetes.io/name: mosquitto-exporter
    app.kubernetes.io/part-of: azure-aks-iot-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mosquitto-exporter
    app.kubernetes.io/part-of: azure-aks-iot-platform
  ports:
    - name: metrics
      port: 9234
      targetPort: metrics
      protocol: TCP
